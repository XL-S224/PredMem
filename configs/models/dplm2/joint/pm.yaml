name: dplm2-joint-none-pm
task: joint
output: outputs/dplm2/joint/none/pm
model:
  family: dplm2
  checkpoint: airkingbd/dplm2_650m
memory:
  enabled: true
  lambda: 0.03
  k: 3
  tracks:
  - sequence
  - structure
  interface: post_ln
  schedule: static
guidance:
  enabled: false
  sequence: 2.0
  structure: 1.5
decoding:
  order: synchronous
  steps: 500
  unmasking: stochastic1.0
  remask: true
  temperature:
    start: 2.0
    end: 0.1
    anneal: true
sampling:
  lengths:
  - 100
  - 200
  - 300
  - 400
  - 500
  per_length: 100
  per_motif: 100
  batch_size: 8
dataset:
  name: cameo2022
  fasta: data/cameo2022/aa_seq.fasta
  reference_dir: data/cameo2022/pdb
  reference_pickle_dir: data/cameo2022/preprocessed
  chain: detect
  motif_dir: data/scaffolding_pdbs/ori_pdbs
  motif_aa: data/scaffolding_pdbs/aa_seq.fasta
  motif_structure: data/scaffolding_pdbs/struct_seq.fasta
diagnostics:
  per_step: false
  save_terminal_tokens: true
extends: ../../../base.yaml
