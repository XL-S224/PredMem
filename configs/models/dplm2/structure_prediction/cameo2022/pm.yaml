name: dplm2-structure_prediction-cameo2022-pm
task: structure_prediction
output: outputs/dplm2/structure_prediction/cameo2022/pm
model:
  family: dplm2
  checkpoint: airkingbd/dplm2_650m
memory:
  enabled: true
  lambda: 0.5
  k: 1
  tracks:
  - structure
  interface: post_ln
  schedule: static
guidance:
  enabled: false
  sequence: 2.0
  structure: 1.5
decoding:
  order: synchronous
  steps: 100
  unmasking: deterministic
  remask: true
  temperature:
    start: 0.0
    end: 0.0
    anneal: false
sampling:
  lengths:
  - 100
  - 200
  - 300
  - 400
  - 500
  per_length: 100
  per_motif: 100
  batch_size: 1
dataset:
  name: cameo2022
  fasta: data/cameo2022/aatype.fasta
  reference_dir: data/cameo2022/pdb
  reference_pickle_dir: data/cameo2022/preprocessed
  chain: detect
  motif_dir: data/scaffolding_pdbs/ori_pdbs
  motif_aa: data/scaffolding_pdbs/aa_seq.fasta
  motif_structure: data/scaffolding_pdbs/struct_seq.fasta
diagnostics:
  per_step: false
  save_terminal_tokens: true
extends: ../../../../base.yaml
