name: dplm21-structure_prediction-pdb_date-default
task: structure_prediction
output: outputs/dplm21/structure_prediction/pdb_date/default
model:
  family: dplm21
  checkpoint: airkingbd/dplm2_bit_650m
memory:
  enabled: false
  lambda: 0.03
  k: 3
  tracks:
  - structure
  interface: post_ln
  schedule: static
guidance:
  enabled: false
  sequence: 2.0
  structure: 1.5
decoding:
  order: synchronous
  steps: 100
  unmasking: deterministic
  remask: true
  temperature:
    start: 0.0
    end: 0.0
    anneal: false
sampling:
  lengths:
  - 100
  - 200
  - 300
  - 400
  - 500
  per_length: 100
  per_motif: 100
  batch_size: 1
dataset:
  name: pdb_date
  fasta: data/pdb_date/aatype.fasta
  reference_dir: data/pdb_date/pdb
  reference_pickle_dir: data/pdb_date/preprocessed
  chain: detect
  motif_dir: data/scaffolding_pdbs/ori_pdbs
  motif_aa: data/scaffolding_pdbs/aa_seq.fasta
  motif_structure: data/scaffolding_pdbs/struct_seq.fasta
diagnostics:
  per_step: false
  save_terminal_tokens: true
extends: ../../../../base.yaml
