name: esm3-inverse_folding-pdb_date-vanilla
task: inverse_folding
output: outputs/esm3/inverse_folding/pdb_date/vanilla
model:
  family: esm3
  checkpoint: esm3-open
memory:
  enabled: false
  lambda: 0.5
  k: 1
  tracks:
  - sequence
  interface: token_embedding
  schedule: static
guidance:
  enabled: false
  sequence: 2.0
  structure: 3.0
decoding:
  order: synchronous
  steps: 8
  unmasking: entropy
  remask: true
  temperature:
    start: 0.5
    end: 0.0
    anneal: true
sampling:
  lengths:
  - 100
  - 200
  - 300
  - 400
  - 500
  per_length: 100
  per_motif: 100
  batch_size: 1
dataset:
  name: pdb_date
  fasta: data/pdb_date/aatype.fasta
  reference_dir: data/pdb_date/pdb
  reference_pickle_dir: data/pdb_date/preprocessed
  chain: detect
  motif_dir: data/scaffolding_pdbs/ori_pdbs
  motif_aa: data/scaffolding_pdbs/aa_seq.fasta
  motif_structure: data/scaffolding_pdbs/struct_seq.fasta
diagnostics:
  per_step: false
  save_terminal_tokens: true
extends: ../../../../base.yaml
