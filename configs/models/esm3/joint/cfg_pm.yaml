name: esm3-joint-none-cfg_pm
task: joint
output: outputs/esm3/joint/none/cfg_pm
model:
  family: esm3
  checkpoint: esm3-open
memory:
  enabled: true
  lambda: 0.3
  k: 3
  tracks:
  - sequence
  - structure
  interface: token_embedding
  schedule: static
guidance:
  enabled: true
  sequence: 2.0
  structure: 3.0
decoding:
  order: synchronous
  steps: length
  unmasking: stochastic
  remask: true
  temperature:
    start: 1.0
    end: 0.0
    anneal: true
sampling:
  lengths:
  - 100
  - 200
  - 300
  - 400
  - 500
  per_length: 100
  per_motif: 100
  batch_size: 1
dataset:
  name: cameo2022
  fasta: data/cameo2022/aa_seq.fasta
  reference_dir: data/cameo2022/pdb
  reference_pickle_dir: data/cameo2022/preprocessed
  chain: detect
  motif_dir: data/scaffolding_pdbs/ori_pdbs
  motif_aa: data/scaffolding_pdbs/aa_seq.fasta
  motif_structure: data/scaffolding_pdbs/struct_seq.fasta
diagnostics:
  per_step: false
  save_terminal_tokens: true
extends: ../../../base.yaml
