name: esm3-structure_prediction-cameo2022-default
task: structure_prediction
output: outputs/esm3/structure_prediction/cameo2022/default
model:
  family: esm3
  checkpoint: esm3-open
memory:
  enabled: false
  lambda: 0.3
  k: 3
  tracks:
  - structure
  interface: token_embedding
  schedule: static
guidance:
  enabled: false
  sequence: 2.0
  structure: 3.0
decoding:
  order: synchronous
  steps: 1
  unmasking: entropy
  remask: false
  temperature:
    start: 0.0
    end: 0.0
    anneal: false
sampling:
  lengths:
  - 100
  - 200
  - 300
  - 400
  - 500
  per_length: 100
  per_motif: 100
  batch_size: 1
dataset:
  name: cameo2022
  fasta: data/cameo2022/aatype.fasta
  reference_dir: data/cameo2022/pdb
  reference_pickle_dir: data/cameo2022/preprocessed
  chain: detect
  motif_dir: data/scaffolding_pdbs/ori_pdbs
  motif_aa: data/scaffolding_pdbs/aa_seq.fasta
  motif_structure: data/scaffolding_pdbs/struct_seq.fasta
diagnostics:
  per_step: false
  save_terminal_tokens: true
extends: ../../../../base.yaml
