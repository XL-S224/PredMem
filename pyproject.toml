[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "protein-inference"
version = "0.1.0"
description = "Multimodal protein inference and evaluation"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3"]
[project.scripts]
protein-inference = "protein_inference.__main__:main"
[tool.setuptools.packages.find]
include = ["protein_inference*"]
